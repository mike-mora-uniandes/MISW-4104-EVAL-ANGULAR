<aside class="user-detail">
  <button class="close-btn" type="button" (click)="onClose()" aria-label="Cerrar detalle">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18"/>
      <path d="m6 6 12 12"/>
    </svg>
  </button>

  <div class="detail-cover">
    <img [src]="user.avatarUrl" [alt]="user.name" class="detail-avatar">
  </div>

  <div class="detail-identity">
    <h2>{{ user.name }}</h2>
    <p class="detail-username">&#64;{{ user.username }}</p>
    <span class="role-pill" [ngClass]="user.role">{{ user.role }}</span>
  </div>

  <div class="detail-info">
    <div class="info-row">
      <div class="info-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>
      <div class="info-text">
        <span class="info-label">Email</span>
        <span class="info-value">{{ user.email }}</span>
      </div>
    </div>

    <div class="info-row">
      <div class="info-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <div class="info-text">
        <span class="info-label">Ubicación</span>
        <span class="info-value">{{ user.location }}</span>
      </div>
    </div>

    <div class="info-row">
      <div class="info-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="4" y1="9" y2="21"/><line x1="20" x2="20" y1="9" y2="21"/>
          <path d="M3 5h18"/><path d="M3 9h18"/>
        </svg>
      </div>
      <div class="info-text">
        <span class="info-label">ID</span>
        <span class="info-value mono">{{ user.id }}</span>
      </div>
    </div>
  </div>

  <div class="detail-repos">
    <div class="section-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      <span>Repositorios</span>
      <span class="section-count">{{ user.repoIds.length }}</span>
    </div>

    <div class="repo-chips" *ngIf="user.repoIds.length > 0; else sinRepos">
      <span class="repo-chip" *ngFor="let id of user.repoIds">#{{ id }}</span>
    </div>
    <ng-template #sinRepos>
      <p class="no-data">Este usuario no tiene repositorios asociados.</p>
    </ng-template>
  </div>
</aside>
