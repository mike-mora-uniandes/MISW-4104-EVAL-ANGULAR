<div class="user-container">
  <h1>Directorio de Usuarios</h1>

  <div class="user-grid">
    <div class="user-card" *ngFor="let user of users">
      
      <div class="avatar-container">
        <img [src]="user.avatarUrl" [alt]="user.name" class="avatar">
        <span class="role-badge" [ngClass]="user.role">{{ user.role }}</span>
      </div>

      <div class="user-info">
        <h3>{{ user.name }}</h3>
        <p class="username">&#64;{{ user.username }}</p>
        
        <div class="details">
          <p><strong>Email:</strong> {{ user.email }}</p>
          <p><strong>Ubicación:</strong> {{ user.location }}</p>
        </div>

        <div class="repos">
          <strong>Repositorios:</strong>
          <div class="repo-list" *ngIf="user.repoIds.length > 0; else noRepos">
            <span *ngFor="let id of user.repoIds" class="repo-tag">
              ID: {{ id }}
            </span>
          </div>
          <ng-template #noRepos>
            <p class="no-data">Sin repositorios</p>
          </ng-template>
        </div>
      </div>

    </div>
  </div>
</div>
