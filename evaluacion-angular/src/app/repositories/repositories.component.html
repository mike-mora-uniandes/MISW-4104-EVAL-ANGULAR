<section class="page">
    <header class="page-header">
      <div>
        <h1>Repositorios</h1>
        <p class="page-subtitle">Proyectos del equipo</p>
      </div>
      <div class="counter">
        <span class="counter-num">{{ repositories.length }}</span>
        <span class="counter-label">repositorios</span>
      </div>
    </header>
  
    <div class="repo-grid">
      <article class="repo-card" *ngFor="let repo of repositories" [routerLink]="['/repositories', repo.id]">
        <div class="repo-card-top">
          <h3 class="repo-name">{{ repo.name }}</h3>
          <span class="lang-pill" [ngClass]="repo.language">{{ repo.language }}</span>
        </div>
  
        <p class="repo-desc">{{ repo.description }}</p>
  
        <div class="repo-meta">
          <span class="meta-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            {{ repo.stars }}
          </span>
          <span class="meta-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="4" rx="2"/>
              <path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>
            </svg>
            {{ repo.createdAt }}
          </span>
          <span class="meta-item owner">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            owner #{{ repo.ownerId }}
          </span>
        </div>
      </article>
    </div>
  </section>
